let actx = null, muted = localStorage.getItem('mmhr_muted') === '1';
const muteBtn = document.getElementById('mute');
function updMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }

function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f1, f2, dur, type = 'square', vol = 0.12, delay = 0) {
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.15, hp = 800) {
  if (muted) return; const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}

let bgCanvas = null;
function buildBg() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.round(W * DPR); bgCanvas.height = Math.round(H * DPR);
  const b = bgCanvas.getContext('2d'); b.scale(DPR, DPR);
  const g = b.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, '#1fb5ba'); g.addColorStop(0.6, '#128187'); g.addColorStop(1, '#06363a');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // repeating con backdrop text
  b.save(); b.globalAlpha = 0.13; b.fillStyle = ORANGE;
  b.font = `900 ${Math.round(22 * U)}px Impact, 'Arial Black', sans-serif`;
  b.textAlign = 'center';
  const sx = 230 * U, sy = 90 * U;
  for (let y = 30 * U, r = 0; y < H + sy; y += sy, r++)
    for (let x = (r % 2) * sx / 2; x < W + sx; x += sx) b.fillText('MONSTER-MANIA', x, y);
  b.restore();
  // little fang logos
  b.save(); b.globalAlpha = 0.09;
  for (let y = 75 * U, r = 0; y < H + sy; y += sy, r++)
    for (let x = ((r + 1) % 2) * sx / 2; x < W + sx; x += sx) drawFangLogo(b, x, y, 16 * U);
  b.restore();
  // vignette
  const v = b.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  b.fillStyle = v; b.fillRect(0, 0, W, H);
}
function drawFangLogo(b, x, y, s) {
  b.fillStyle = '#fff'; b.beginPath(); b.ellipse(x, y, s * 1.4, s, 0, 0, Math.PI * 2); b.fill();
  b.fillStyle = RED;
  b.beginPath(); b.moveTo(x - s * 0.9, y - s * 0.3); b.lineTo(x - s * 0.5, y + s * 0.9); b.lineTo(x - s * 0.2, y - s * 0.3); b.fill();
  b.beginPath(); b.moveTo(x + s * 0.9, y - s * 0.3); b.lineTo(x + s * 0.5, y + s * 0.9); b.lineTo(x + s * 0.2, y - s * 0.3); b.fill();
}

// ---------- spawning ----------
function spawnMonster() {
  const side = (Math.random() * 4) | 0, m = 60 * U;
  let x, y;
  if (side === 0) { x = rand(0, W); y = -m; } else if (side === 1) { x = W + m; y = rand(0, H); }
  else if (side === 2) { x = rand(0, W); y = H + m; } else { x = -m; y = rand(0, H); }
  const roll = Math.random();
  let type;
  if (wave < 2) type = roll < 0.75 ? 'ghost' : 'blob';
  else if (wave < 3) type = roll < 0.5 ? 'ghost' : roll < 0.8 ? 'blob' : 'vamp';
  else type = roll < 0.38 ? 'ghost' : roll < 0.68 ? 'blob' : 'vamp';
  monsters.push(makeMonster(type, x, y));
}
function makeMonster(type, x, y, small) {
  const sp = 1 + (wave - 1) * 0.08;
  const base = { type, x, y, vx: 0, vy: 0, t: rand(0, 10), flash: 0, wob: 0 };
  if (type === 'ghost') return Object.assign(base, { r: 24 * U, hp: 1, speed: 70 * U * sp, pts: 100 });
  if (type === 'vamp') return Object.assign(base, { r: 26 * U, hp: 2, speed: 95 * U * sp, pts: 250, dash: rand(1.5, 3), dashing: 0 });
  if (type === 'blob') return small
    ? Object.assign(base, { r: 15 * U, hp: 1, speed: 85 * U * sp, pts: 50, small: true })
    : Object.assign(base, { r: 32 * U, hp: 3, speed: 45 * U * sp, pts: 200 });
}
const PICKUPS = [
  { kind: 'garlic', w: 3, label: 'GARLIC SPREAD!' },

function dropPickup(x, y, force) {
  if (!force && Math.random() > 0.12) return;
  let tot = PICKUPS.reduce((s, p) => s + p.w, 0), r = Math.random() * tot, p;
  for (p of PICKUPS) { if ((r -= p.w) <= 0) break; }
  const m = 40 * U;

}

// ---------- shooting ----------
function nearestMonster() {
  let best = null, bd = Infinity;
  for (const m of monsters) { const d = dist2(m, player); if (d < bd) { bd = d; best = m; } }
  return best;
}
function tryShoot(manual) {
  if (player.cool > 0) return;
  let ang;
  const target = nearestMonster();
  if (!pointer.isTouch && pointer.down && manual === 'aim') ang = Math.atan2(pointer.y - player.y, pointer.x - player.x);
  else if (target) {
    // lead the target a bit
    const tx = target.x + target.vx * 0.15, ty = target.y + target.vy * 0.15;
    ang = Math.atan2(ty - player.y, tx - player.x);
  } else ang = player.face > 0 ? 0 : Math.PI;
  const rapid = power.rapid > 0;
  player.cool = rapid ? 0.09 : 0.2;
  const angles = power.spread > 0 ? [-0.28, -0.14, 0, 0.14, 0.28] : [0];
  const garlic = power.spread > 0;
  const ox = player.x, oy = player.y - headSize() * 0.2;
  for (const a of angles) {
    const A = ang + a, s = (garlic ? 520 : 760) * U;
    bullets.push({ x: ox + Math.cos(A) * 20 * U, y: oy + Math.sin(A) * 20 * U, vx: Math.cos(A) * s, vy: Math.sin(A) * s, a: A, life: garlic ? 0.75 : 0.55, garlic, spin: rand(0, 6), r: (garlic ? 9 : 7) * U });
  }
  player.sq = Math.min(player.sq + 0.15, 0.3);
  garlic ? sfx.garlic() : sfx.shoot();
}

// ---------- effects ----------
function burst(x, y, color, n = 14, sp = 260) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.3, 1) * sp * U;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.9), max: 0.9, r: rand(3, 7) * U, color, g: 300 * U });
  }
}
function floatText(x, y, text, color = '#fff', size = 22) { texts.push({ x, y, text, color, size: size * U, t: 0, life: 1.1 }); }

// ---------- update ----------
function update(dt) {
  if (state !== 'play' || paused) {
    if (state === 'over') overTimer += dt;
    // still animate particles on game over
    if (state === 'over') updParticles(dt);
    return;
  }
  time += dt; waveTimer += dt;
  if (waveTimer > 25) {
    waveTimer = 0; wave++;
    banner = { text: 'WAVE ' + wave, sub: pick(['They smell the hair gel!', 'Fang-fest incoming!', 'Ghouls just wanna have fun', 'More monsters than a con line!', 'Keep that head bobbing!']), t: 2.2 };
    sfx.wave(); dropPickup(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.8), true);
  }
  // spawning
  spawnTimer -= dt;
  const interval = Math.max(0.28, 1.15 - wave * 0.1 - time * 0.003);
  if (spawnTimer <= 0) {
    spawnTimer = interval * rand(0.6, 1.3);
    const n = 1 + (Math.random() < Math.min(0.5, wave * 0.06) ? 1 : 0);
    for (let i = 0; i < n; i++) spawnMonster();
  }
  for (const k in power) power[k] = Math.max(0, power[k] - dt);

  // player movement
  const p = player;
  let ix = 0, iy = 0;
  if (keys['arrowleft'] || keys['a']) ix -= 1;
  if (keys['arrowright'] || keys['d']) ix += 1;
  if (keys['arrowup'] || keys['w']) iy -= 1;
  if (keys['arrowdown'] || keys['s']) iy += 1;
  const maxSp = 340 * U;
  let tvx = 0, tvy = 0;
  if (ix || iy) { const l = Math.hypot(ix, iy); tvx = ix / l * maxSp; tvy = iy / l * maxSp; }

    // follow pointer (offset upward a little on touch so the finger doesn't hide the face)
    const tx = pointer.x, ty = pointer.y - (pointer.isTouch ? 60 * U : 0);
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d > 4) { const s = Math.min(maxSp * 1.25, d * 9); tvx = dx / d * s; tvy = dy / d * s; }

  p.x = clamp(p.x + p.vx * dt, p.r, W - p.r); p.y = clamp(p.y + p.vy * dt, p.r, H - p.r);
  if (Math.abs(p.vx) > 20) p.face = Math.sign(p.vx);
  const speed = Math.hypot(p.vx, p.vy);
  p.bob += dt * (6 + speed / 40);
  p.tilt += ((p.vx / maxSp) * 0.25 - p.tilt) * k;
  p.sq *= Math.exp(-dt * 8);
  p.inv = Math.max(0, p.inv - dt); p.cool -= dt; p.spin *= Math.exp(-dt * 5); p.hurtT = Math.max(0, p.hurtT - dt);

  // firing
  if (keys[' '] || keys['enter'] || keys['f'] || keys['j']) tryShoot(false);
  if (pointer.down) tryShoot(false);
  if (usedTouch && !pointer.down && monsters.length) tryShoot(false); // auto-fire on phones

  // bullets
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; b.spin += dt * 14; }
  bullets = bullets.filter(b => b.life > 0 && b.x > -50 && b.x < W + 50 && b.y > -50 && b.y < H + 50);

  // monsters
  for (const m of monsters) {
    m.t += dt; m.flash = Math.max(0, m.flash - dt * 6); m.wob *= Math.exp(-dt * 6);
    const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy) || 1;
    let sp = m.speed;
    if (m.type === 'ghost') {
      const perp = Math.sin(m.t * 3) * 0.8;
      m.vx = (dx / d + (-dy / d) * perp) * sp; m.vy = (dy / d + (dx / d) * perp) * sp;
    } else if (m.type === 'vamp') {
      m.dash -= dt;
      if (m.dash <= 0 && !m.dashing) { m.dashing = 0.45; m.dash = rand(1.8, 3.2); }
      if (m.dashing) { m.dashing = Math.max(0, m.dashing - dt); sp *= 3.2; }

    } else {
      const hop = 0.6 + 0.8 * Math.max(0, Math.sin(m.t * 5));
      m.vx = dx / d * sp * hop; m.vy = dy / d * sp * hop;
    }
    m.x += m.vx * dt; m.y += m.vy * dt;
  }
  // separation between monsters (cheap)
  for (let i = 0; i < monsters.length; i++) for (let j = i + 1; j < monsters.length; j++) {
    const a = monsters[i], b = monsters[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
    if (d2 < rr * rr && d2 > 0.01) { const d = Math.sqrt(d2), o = (rr - d) / 2; a.x -= dx / d * o; a.y -= dy / d * o; b.x += dx / d * o; b.y += dy / d * o; }
  }

  // bullet vs monster
  for (const b of bullets) {
    if (b.life <= 0) continue;
    for (const m of monsters) {
      if (m.hp <= 0) continue;
      const rr = b.r + m.r;
      if (dist2(b, m) < rr * rr) {
        b.life = 0; m.hp--; m.flash = 1; m.wob = 1;
        m.x += b.vx * 0.012; m.y += b.vy * 0.012;
        if (m.hp <= 0) killMonster(m); else { sfx.hit(); burst(b.x, b.y, '#fff', 5, 150); }
        break;
      }
    }
  }
  monsters = monsters.filter(m => m.hp > 0);

  // monster vs player
  for (const m of monsters) {
    const rr = m.r * 0.8 + p.r;
    if (dist2(m, p) < rr * rr) {
      if (power.shield > 0) { m.hp = 0; killMonster(m); continue; }
      if (p.inv <= 0) hurtPlayer(m);
    }
  }
  monsters = monsters.filter(m => m.hp > 0);

  // pickups
  for (const it of pickups) {
    it.t += dt; it.life -= dt;
    const rr = p.r + 20 * U;
    if (dist2(it, p) < rr * rr) { collect(it); it.life = 0; }
  }
  pickups = pickups.filter(it => it.life > 0);

  comboTimer -= dt; if (comboTimer <= 0) combo = 0;
  updParticles(dt);

  shake = Math.max(0, shake - dt * 30);
}
function updParticles(dt) {
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += q.g * dt; q.vx *= 0.98; q.life -= dt; }

  burst(m.x, m.y, col, m.small ? 8 : 16); burst(m.x, m.y, ORANGE, 5, 180);

  // knock the monster back
  const dx = m.x - player.x, dy = m.y - player.y, d = Math.hypot(dx, dy) || 1;

function collect(it) {
  sfx.pickup(); burst(it.x, it.y, ORANGE, 14, 220);
  floatText(it.x, it.y - 20 * U, it.label, ORANGE, 24);
  player.sq = 0.35;
  if (it.kind === 'garlic') power.spread = 8;
  else if (it.kind === 'shades') power.rapid = 8;

  else if (it.kind === 'bubble') power.shield = 6;

function gameOver() {

  ctx.translate(0, Math.abs(Math.sin(bob)) * -h * 0.06);

    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rr = i % 2 ? s * 0.6 : s * 1.2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.font = `900 ${12 * U}px Impact, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('AAH', 0, 1);
  } else if (it.kind === 'bubble') {
    ctx.strokeStyle = '#9ff'; ctx.fillStyle = 'rgba(160,255,255,0.35)'; ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4a2b1a'; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-s * 0.4 + i * s * 0.2, -s * 0.1 + Math.sin(i * 2) * s * 0.1, s * 0.22, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.8);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.8); ctx.closePath();
}
function drawBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  if (b.garlic) {
    ctx.rotate(b.spin); const s = b.r * 1.2;
    ctx.fillStyle = '#fbf6e9'; ctx.strokeStyle = '#6b5a3a'; ctx.lineWidth = 2 * U;
    ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * 1.1, 0, 0, s); ctx.quadraticCurveTo(-s * 0.5, 0, 0, -s); ctx.fill(); ctx.stroke();
  } else {
    ctx.rotate(b.a);
    const L = 26 * U;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(-L, 0, L * 0.5, 0);
    g.addColorStop(0, 'rgba(255,40,80,0)'); g.addColorStop(1, power.rapid > 0 ? '#ffe14a' : '#ff3b6b');
    ctx.strokeStyle = g; ctx.lineCap = 'round'; ctx.lineWidth = 8 * U;
    ctx.beginPath(); ctx.moveTo(-L, -4 * U); ctx.lineTo(L * 0.4, -4 * U); ctx.moveTo(-L, 4 * U); ctx.lineTo(L * 0.4, 4 * U); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * U;
    ctx.beginPath(); ctx.moveTo(-L * 0.4, -4 * U); ctx.lineTo(L * 0.4, -4 * U); ctx.moveTo(-L * 0.4, 4 * U); ctx.lineTo(L * 0.4, 4 * U); ctx.stroke();
  }
  ctx.restore();
}
function outlinedText(t, x, y, size, fill, align = 'center', stroke = '#1a0006', lw) {
  ctx.font = `900 ${size}px Impact, 'Arial Black', 'Helvetica Neue', sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw || Math.max(3, size * 0.16); ctx.strokeStyle = stroke;
  ctx.strokeText(t, x, y); ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function drippyTitle(x, y, size, t) {
  const lines = ['MONSTER-MANIA', 'HEAD RUSH'];
  lines.forEach((ln, i) => {
    const s = i ? size * 1.15 : size * 0.75;
    const yy = y + (i ? size * 0.95 : 0) + Math.sin(t * 3 + i) * 4;
    ctx.save(); ctx.translate(x, yy); ctx.rotate(Math.sin(t * 2 + i) * 0.02);
    outlinedText(ln, 0, 0, s, i ? RED : ORANGE, 'center', '#1a0006', s * 0.2);
    // drips
    if (i) {
      ctx.font = `900 ${s}px Impact, 'Arial Black', sans-serif`;
      const w = ctx.measureText(ln).width;
      ctx.fillStyle = RED;
      for (let k = 0; k < 9; k++) {
        const dx = -w / 2 + (k + 0.5) * w / 9, len = (0.15 + ((k * 37) % 10) / 22) * s * (0.8 + 0.2 * Math.sin(t * 2 + k));
        ctx.beginPath(); ctx.moveTo(dx - 4, s * 0.3); ctx.lineTo(dx - 3, s * 0.3 + len); ctx.arc(dx, s * 0.3 + len, 4.5 * U, Math.PI, 0, true); ctx.lineTo(dx + 4, s * 0.3); ctx.fill();
      }
    }
    ctx.restore();
  });
}
function button(x, y, w, h, label, t) {
  const s = 1 + Math.sin(t * 5) * 0.04;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = RED_D; roundRect(-w / 2, -h / 2 + 5, w, h, h / 2); ctx.fill();
  ctx.fillStyle = RED; roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  outlinedText(label, 0, 1, h * 0.48, '#fff', 'center', RED_D, 4);
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

let titleT = 0;
const titleMonsters = [];
function render(dt) {
  titleT += dt;
  ctx.save();
  if (shake > 0 && state === 'play') ctx.translate(rand(-shake, shake), rand(-shake, shake));
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

  if (state === 'title') renderTitle();
  else {
    for (const it of pickups) drawPickup(it);
    for (const m of monsters) m.type === 'ghost' ? drawGhost(m) : m.type === 'vamp' ? drawVamp(m) : drawBlob(m);
    for (const b of bullets) drawBullet(b);
    // player
    if (state === 'play') {
      const p = player;
      if (!(p.inv > 0 && Math.floor(p.inv * 12) % 2)) {
        drawHead(p.x, p.y, headSize(), { sq: p.sq, bob: p.bob, tilt: p.tilt, spin: p.spin, flip: 1 });
        if (p.hurtT > 0) { // dizzy stars
          for (let i = 0; i < 3; i++) { const a = titleT * 8 + i * 2.1; outlinedText('★', p.x + Math.cos(a) * 40 * U, p.y - headSize() * 0.55 + Math.sin(a) * 10 * U, 18 * U, '#ffd21f', 'center', '#000', 3); }
        }
      }
      if (power.shield > 0) {
        ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(titleT * 10) * (power.shield < 1.5 ? 2 : 1);
        ctx.strokeStyle = '#aff'; ctx.lineWidth = 5 * U; ctx.fillStyle = 'rgba(150,255,255,0.15)';
        ctx.beginPath(); ctx.arc(p.x, p.y, headSize() * 0.72, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      if (power.rapid > 0) { // cool shades glint
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,240,120,0.8)';
        const gx = p.x + Math.sin(titleT * 6) * headSize() * 0.2, gy = p.y - headSize() * 0.28;
        ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, rr = i % 2 ? 2 * U : 9 * U; ctx.lineTo(gx + Math.cos(a) * rr, gy + Math.sin(a) * rr); } ctx.fill(); ctx.restore();
      }
    }
    for (const q of particles) {
      if (q.ring) { const k = 1 - q.life / q.max; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k); ctx.strokeStyle = '#ffd21f'; ctx.lineWidth = 14 * U; ctx.beginPath(); ctx.arc(q.x, q.y, k * Math.max(W, H), 0, 7); ctx.stroke(); ctx.restore(); continue; }
      ctx.globalAlpha = clamp(q.life / 0.5, 0, 1); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const t of texts) {
      const k = t.t / t.life, s = t.size * (k < 0.15 ? 0.6 + k / 0.15 * 0.6 : 1.2 - (k - 0.15) * 0.25);
      ctx.globalAlpha = 1 - Math.max(0, (k - 0.6) / 0.4);
      ctx.font = `900 ${s}px Impact, 'Arial Black', 'Helvetica Neue', sans-serif`;
      const hw = ctx.measureText(t.text).width / 2 + 8;
      outlinedText(t.text, hw * 2 < W ? clamp(t.x, hw, W - hw) : W / 2, clamp(t.y - k * 50 * U, s, H - s), s, t.color);
    }
    ctx.globalAlpha = 1;
    renderHUD();
    if (banner && state === 'play') {
      const k = banner.t, a = Math.min(1, k / 0.4, (2.2 - k) / 0.3);
      ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
      const sc = 1 + Math.max(0, (k - 1.9)) * 2;
      ctx.translate(W / 2, H * 0.32); ctx.scale(sc, sc);
      outlinedText(banner.text, 0, 0, 64 * U, RED, 'center', '#fff', 10 * U);
      outlinedText(banner.sub, 0, 52 * U, 24 * U, CREAM);
      ctx.restore();
    }
    if (state === 'over') renderOver();
    if (paused && state === 'play') {
      ctx.fillStyle = 'rgba(0,20,25,0.6)'; ctx.fillRect(0, 0, W, H);
      outlinedText('PAUSED', W / 2, H / 2 - 20 * U, 70 * U, ORANGE);
      outlinedText('Press P or tap to resume', W / 2, H / 2 + 40 * U, 22 * U, '#fff');
    }
  }
  ctx.restore();
}
function renderHUD() {
  const pad = 14 * U;
  outlinedText('SCORE ' + score.toLocaleString(), pad, pad + 16 * U, 28 * U, '#fff', 'left');
  outlinedText('BEST ' + Math.max(best, score).toLocaleString() + '   WAVE ' + wave, pad, pad + 46 * U, 17 * U, CREAM, 'left');
  for (let i = 0; i < lives; i++) {
    ctx.save(); ctx.fillStyle = RED; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    heartPath(pad + 14 * U + i * 30 * U, pad + 78 * U + Math.sin(titleT * 4 + i) * 2, 12 * U); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // combo
  if (combo >= 3) {
    const mult = Math.min(5, 1 + Math.floor(combo / 5));
    outlinedText(combo + ' COMBO' + (mult > 1 ? '  x' + mult : ''), W / 2, pad + 20 * U, (24 + Math.min(combo, 20)) * U, mult > 1 ? ORANGE : '#fff');
  }
  // power-up bars
  let y = H - pad - 10 * U;
  const bars = [['GARLIC', power.spread, 8, '#fbf6e9'], ['SHADES', power.rapid, 8, '#ffe14a'], ['SHIELD', power.shield, 6, '#9ff']];
  for (const [n, v, max, c] of bars) {
    if (v <= 0) continue;
    const w = 140 * U;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(pad, y - 9 * U, w, 18 * U, 9 * U); ctx.fill();
    ctx.fillStyle = c; roundRect(pad, y - 9 * U, Math.max(18 * U, w * v / max), 18 * U, 9 * U); ctx.fill();
    outlinedText(n, pad + w + 8 * U, y, 16 * U, c, 'left', '#000', 4);
    y -= 26 * U;
  }
}
function renderTitle() {
  const t = titleT;
  // parade of monsters around
  const n = 6;
  for (let i = 0; i < n; i++) {
    const a = t * 0.5 + i / n * Math.PI * 2;
    const m = { x: W / 2 + Math.cos(a) * Math.min(W * 0.4, 330 * U), y: H * 0.53 + Math.sin(a) * Math.min(H * 0.15, 130 * U), t: t + i, r: 24 * U, wob: 0, flash: 0, small: false, dashing: 0 };
    i % 3 === 0 ? drawGhost(m) : i % 3 === 1 ? drawVamp(m) : drawBlob(m);
  }
  const size = Math.min(160 * U, H * 0.26);
  drawHead(W / 2, H * 0.53, size, { bob: t * 4, sq: Math.max(0, Math.sin(t * 8)) * 0.08, tilt: Math.sin(t * 2) * 0.12 });
  const ts = Math.min(64 * U, W / 9.5);
  drippyTitle(W / 2, H * 0.11 + ts * 0.3, ts, t);
  button(W / 2, H * 0.8, Math.min(320 * U, W * 0.8), 58 * U, usedTouch ? 'TAP TO PLAY' : 'CLICK / SPACE TO PLAY', t);
  const ctl = usedTouch || ('ontouchstart' in window)
    ? 'Drag to move • Auto-fires sunglass lasers • Grab goodies!'
    : 'Move: WASD / Arrows / hold mouse • Shoot: Space / click • M mute • P pause';
  outlinedText(ctl, W / 2, H * 0.8 + 50 * U, Math.min(17 * U, W / 34), CREAM, 'center', '#000', 4);
  if (best > 0) outlinedText('HIGH SCORE: ' + best.toLocaleString(), W / 2, H * 0.8 + 80 * U, 20 * U, ORANGE, 'center', '#000', 4);
}
function renderOver() {
  const k = Math.min(1, overTimer / 0.5);
  ctx.fillStyle = `rgba(20,0,6,${0.62 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H * 0.24); const s = 0.5 + 0.5 * k + Math.sin(overTimer * 3) * 0.02; ctx.scale(s, s);
  outlinedText('GAME OVER', 0, 0, Math.min(84 * U, W / 7), RED, 'center', '#fff', 10 * U);
  ctx.restore();
  // sad spinning head
  drawHead(W / 2, H * 0.45, Math.min(120 * U, H * 0.2), { tilt: Math.sin(overTimer * 2) * 0.3, bob: overTimer * 2, noShadow: true });
  outlinedText('The monsters got your noggin!', W / 2, H * 0.45 + Math.min(120 * U, H * 0.2) * 0.65 + 6 * U, 20 * U, CREAM);
  outlinedText('SCORE ' + score.toLocaleString(), W / 2, H * 0.66, 40 * U, '#fff');
  if (newBest) outlinedText('★ NEW HIGH SCORE! ★', W / 2, H * 0.66 + 40 * U, 26 * U + Math.sin(overTimer * 8) * 2, ORANGE);
  else outlinedText('BEST ' + best.toLocaleString(), W / 2, H * 0.66 + 40 * U, 24 * U, ORANGE);
  if (overTimer > 0.9) button(W / 2, H * 0.85, Math.min(300 * U, W * 0.8), 56 * U, usedTouch ? 'TAP TO RETRY' : 'PLAY AGAIN (SPACE)', overTimer);

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(dt);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
// tiny hook for automated tests
window.__headRush = { start: startGame, get state() { return state; }, get score() { return score; }, get monsters() { return monsters ? monsters.length : 0; } };
})();
</script>
